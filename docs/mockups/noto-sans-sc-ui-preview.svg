<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .ui { font-family: "Noto Sans SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .ink { fill: #07152f; }
      .muted { fill: #71809b; }
      .green { fill: #1fad86; }
      .green2 { fill: #2cc9b7; }
      .blue { fill: #5657e8; }
      .yellow { fill: #f3b82e; }
      .red { fill: #e95656; }
      .panel { fill: #fbfffd; stroke: #d8f1e9; stroke-width: 2; }
      .card { fill: #f4fffb; stroke: #d9f0e8; stroke-width: 1.5; }
      .button { fill: #1fad86; }
      .softButton { fill: #eef3f2; }
      .hair { stroke: #d3efe6; stroke-width: 2; }
      .shadow { filter: drop-shadow(0 16px 28px rgba(4, 32, 29, .12)); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f5faf8"/>

  <g class="ui">
