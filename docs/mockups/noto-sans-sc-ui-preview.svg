    <text x="42" y="102" class="muted" font-size="19" font-weight="400">用于观察商用开源字体在 PC、统计页、安卓版中的统一观感</text>

    <!-- PC main window -->
    <g transform="translate(42 138)" class="shadow">
      <rect x="0" y="0" width="375" height="552" rx="20" fill="#ffffff" stroke="#d9e4df"/>
      <rect x="0" y="0" width="375" height="52" rx="20" fill="#f3f0ec"/>
      <rect x="0" y="38" width="375" height="16" fill="#f3f0ec"/>
