        <text x="14" y="28" class="muted" font-size="16">本周</text>
        <text x="14" y="55" class="ink" font-size="24" font-weight="800">23小时</text>
      </g>
      <g transform="translate(37 350)">
        <rect width="82" height="69" rx="14" class="card"/>
        <text x="14" y="28" class="muted" font-size="16">本月</text>
        <text x="14" y="55" class="ink" font-size="24" font-weight="800">12小时</text>
